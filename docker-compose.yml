version: "3.9"

services:
  # --------------------------------------------------------------
  #  One service per Raft node.  Duplicate or remove blocks to add/remove nodes.
  # --------------------------------------------------------------
  node-a:
    image: mirani9/raft-engine:v2.6
    container_name: raft-node-a
    environment:
      - NODE_ID=A
      - PORT=4000
    ports:
      - "4000:4000"

  node-b:
    image: mirani9/raft-engine:v2.6
    container_name: raft-node-b
    environment:
      - NODE_ID=B
      - PORT=4001
    ports:
      - "4001:4000"

  node-c:
    image: mirani9/raft-engine:v2.6
    container_name: raft-node-c
    environment:
      - NODE_ID=C
      - PORT=4002
    ports:
      - "4002:4000"

  # Add more nodes (D, E, …) by copying a block and changing NODE_ID & host port.
