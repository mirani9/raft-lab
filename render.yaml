services:
  - type: web
    name: raft-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node services/gateway/server.js
    envVars:
      - key: GATEWAY_PORT
        value: "5000"
      - key: NODE_URLS
        sync: false
      - key: RAFT_NODE_URL
        sync: false

  - type: web
    name: raft-node-1
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node services/raft-node/server.js
    envVars:
      - key: NODE_ID
        value: "N1"
      - key: PORT
        value: "4001"
      - key: PEERS
        sync: false
      - key: STORE_URL
        sync: false
      - key: STORE_TOKEN
        sync: false

